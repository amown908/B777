<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B777 Overhead Switch Locator</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #1a1412; color: #e2e8f0;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .back-link { align-self: flex-start; color: #f59e0b; text-decoration: none; font-weight: bold; margin-bottom: 15px; }
        h1 { color: #fff; margin-bottom: 5px; text-align: center; }
        .subtitle { color: #bcaaa4; margin-bottom: 20px; text-align: center; }

        .btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-trigger {
            background: #3e2723; color: #f59e0b; border: 1px solid #f59e0b;
            padding: 10px 18px; border-radius: 6px; cursor: pointer; font-weight: bold;
        }
        .btn-trigger:hover, .btn-trigger.active { background: #f59e0b; color: #1a1412; }

        /* Overhead Image Hotzones Container */
        .image-container {
            position: relative; width: 700px; max-width: 100%;
            border: 4px solid #3e2723; border-radius: 8px; overflow: hidden; margin-bottom: 30px;
        }
        .image-container img { width: 100%; display: block; }
        .switch-zone {
            position: absolute; background: rgba(245, 158, 11, 0.05);
            border: 2px solid rgba(245, 158, 11, 0.45); border-radius: 4px; cursor: pointer;
        }
        .switch-zone:hover { background: rgba(245, 158, 11, 0.25); border-color: #f59e0b; }

        /* Hotzone Grid Coordinates */
        #zone-adiru         { top: 59%; left: 4%; width: 22.5%; height: 8.5%; }
        #zone-electrical    { top: 67.5%; left: 4%; width: 22.5%; height: 16.5%; }
        #zone-wipers-lights { top: 85%; left: 4%; width: 22.5%; height: 8%; }
        #zone-emer-lights   { top: 55.5%; left: 27.5%; width: 20%; height: 12.25%; }
        #zone-hyd-ram-air   { top: 68%; left: 27.5%; width: 21%; height: 15%; }
        #zone-pass-signs    { top: 90%; left: 37%; width: 5%; height: 3%; }
        #zone-engine-mcp    { top: 50.5%; left: 49%; width: 22%; height: 17.5%; }
        #zone-fuel-jettison { top: 68.25%; left: 49%; width: 22%; height: 15.75%; }
        #zone-anti-ice      { top: 90%; left: 49.5%; width: 14%; height: 3%; }
        #zone-air-cond      { top: 54.5%; left: 72%; width: 22.5%; height: 13%; }
        #zone-bleed-press   { top: 68.5%; left: 71%; width: 22.5%; height: 16%; }
        #zone-lighting-r    { top: 85%; left: 71%; width: 22.5%; height: 8%; }

        /* Search & Table */
        .parts-section { width: 100%; max-width: 1000px; }
        .search-box {
            width: 100%; padding: 12px; background: #2b1f1c; border: 1px solid #4e342e;
            border-radius: 6px; color: #fff; font-size: 1em; margin-bottom: 15px;
        }
        .table-container { background: #2b1f1c; border: 1px solid #4e342e; border-radius: 8px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9em; }
        th, td { padding: 10px 14px; border-bottom: 1px solid #4e342e; }
        th { background: #3e2723; color: #f59e0b; font-size: 0.8em; text-transform: uppercase; }
        .part-no { font-family: monospace; color: #f59e0b; }
        .old-ref { font-size: 0.75em; color: #a1887f; display: block; }
        .swap-tag { display: inline-block; background: #3e2723; color: #f59e0b; border: 1px solid #f59e0b; padding: 2px 6px; border-radius: 4px; font-size: 0.75em; margin-top: 2px; }

        /* Popups & Lightbox */
        .overlay-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 99; }
        .popup-box {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #231816; border: 2px solid #f59e0b; padding: 20px; border-radius: 8px;
            z-index: 100; width: 95%; max-width: 650px;
        }
        .popup-box h3 { margin: 0 0 10px 0; color: #fff; border-bottom: 1px solid #4e342e; padding-bottom: 5px; }
        .close-btn { position: absolute; top: 10px; right: 10px; background: #4e342e; color: #fff; border: none; padding: 4px 8px; cursor: pointer; border-radius: 4px; }
        .close-btn:hover { background: #f59e0b; color: #1a1412; }
    </style>
</head>
<body>

    <a href="overhead.html" class="back-link">← Back to Overhead Panel</a>
    <h1>Overhead Panel Switches</h1>
    <p class="subtitle">Click any image zone or search part numbers below to find donor swap options.</p>

    <div class="btn-group">
        <button class="btn-trigger" onclick="showPhoto('PBGuide.jpg')">Open Switches Guide Photo</button>
        <button class="btn-trigger" id="swapBtn" onclick="toggleSwappable()">Show Swappable Parts Only</button>
    </div>

    <!-- Hotzone Image View -->
    <div class="image-container">
        <img src="overhead.jpeg" alt="Overhead Panel">
        <div class="switch-zone" id="zone-adiru" onclick="openZone('adiru')" title="PFC / ADIRU"></div>
        <div class="switch-zone" id="zone-electrical" onclick="openZone('electrical')" title="Electrical"></div>
        <div class="switch-zone" id="zone-wipers-lights" onclick="openZone('wipers-lights')" title="Left Wipers"></div>
        <div class="switch-zone" id="zone-emer-lights" onclick="openZone('emer-lights')" title="Window Heat / Oxy"></div>
        <div class="switch-zone" id="zone-hyd-ram-air" onclick="openZone('hyd-ram-air')" title="Hydraulics"></div>
        <div class="switch-zone" id="zone-pass-signs" onclick="openZone('pass-signs')" title="Passenger Signs"></div>
        <div class="switch-zone" id="zone-engine-mcp" onclick="openZone('engine-mcp')" title="Cargo Fire / EEC"></div>
        <div class="switch-zone" id="zone-fuel-jettison" onclick="openZone('fuel-jettison')" title="Fuel System"></div>
        <div class="switch-zone" id="zone-anti-ice" onclick="openZone('anti-ice')" title="Anti-Ice / Lights"></div>
        <div class="switch-zone" id="zone-air-cond" onclick="openZone('air-cond')" title="Air Conditioning"></div>
        <div class="switch-zone" id="zone-bleed-press" onclick="openZone('bleed-press')" title="Bleed Air"></div>
        <div class="switch-zone" id="zone-lighting-r" onclick="openZone('lighting-r')" title="Right Wipers"></div>
    </div>

    <!-- Master Search Table -->
    <div class="parts-section">
        <h2>Master Parts Index</h2>
        <input class="search-box" type="text" id="searchInput" onkeyup="filterData()" placeholder="Type switch description, system, or part number (e.g. 32500-205, 09-531-0005)...">
        
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Panel / Component</th>
                        <th>Boeing Part #</th>
                        <th>Korry Top Level</th>
                        <th>Cap Part #</th>
                        <th>Qty / Swap Locations</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Reusable Popup Box -->
    <div id="dark-screen" class="overlay-screen" onclick="closeModal()"></div>
    <div id="popupModal" class="popup-box">
        <button class="close-btn" onclick="closeModal()">✕</button>
        <h3 id="popupTitle">Panel Details</h3>
        <div id="popupContent"></div>
    </div>

    <!-- Photo Lightbox -->
    <div id="photoModal" class="popup-box" style="text-align:center; max-width:800px;">
        <img id="photoImg" src="" style="max-width:100%; border-radius:4px; margin-bottom:10px;">
        <button class="btn-trigger" onclick="closeModal()">Close Photo</button>
    </div>

    <script>
        // SINGLE MASTER DATA LIST - Add or edit parts here easily!
        const switches = [
            // Electrical
            { zone: 'electrical', panel: 'Electrical', name: 'On/Off Switch', boeing: 'S231W240-201', korryTL: '32500-201', cap: '32500-701', qty: 8, old: '', swap: 'Shared with Anti-Ice (2) & Autostart (1)' },
            { zone: 'electrical', panel: 'Electrical', name: 'AVAIL / ON (Ground Power)', boeing: 'S231W240-205', korryTL: '32500-205', cap: '32500-705', qty: 2, old: '09-530-0105 / 09-531-0005', swap: 'Primary Grd Power <-> Secondary Grd Power' },
            { zone: 'electrical', panel: 'Electrical', name: 'Auto/Isln Switch', boeing: 'S231W240-211', korryTL: '32500-211', cap: '32500-711', qty: 2, old: '', swap: 'BTB 1 <-> BTB 2 Bus Isln' },
            { zone: 'electrical', panel: 'Electrical', name: 'Drive Switch', boeing: 'S231W240-216', korryTL: '32500-216', cap: '32500-716', qty: 2, old: '', swap: 'IDG 1 <-> IDG 2 Disconnect' },

            // Air Conditioning & Bleed Air
            { zone: 'air-cond', panel: 'Air Conditioning', name: 'Packs L&R - Auto/Off', boeing: 'S231W240-212', korryTL: '32500-212', cap: '32500-712', qty: 2, old: '', swap: 'Shared with APU Bleed & TAC Panel' },
            { zone: 'air-cond', panel: 'Air Conditioning', name: 'Recirc Fans - On/Off', boeing: 'S231W240-202', korryTL: '32500-202', cap: '32500-702', qty: 2, old: '', swap: 'Shared with Ext Lights & Storm Switch' },
            { zone: 'air-cond', panel: 'Air Conditioning', name: 'Trim Air L&R - On/Fault', boeing: 'S231W240-203', korryTL: '32500-203', cap: '32500-703', qty: 2, old: '', swap: 'Shared with Hydraulic Pumps (4)' },
            { zone: 'bleed-press', panel: 'Bleed Air', name: 'APU Bleed - Auto/Off', boeing: 'S231W240-212', korryTL: '32500-212', cap: '32500-712', qty: 1, old: '', swap: 'Shared with A/C Packs (2)' },

            // Engine & Cargo Fire
            { zone: 'engine-mcp', panel: 'Engine & Cargo Fire', name: 'Engine EEC L&R - Norm/Altn', boeing: 'S231W240-209', korryTL: '32500-209', cap: '32500-709', qty: 2, old: '', swap: 'Left EEC <-> Right EEC' },
            { zone: 'engine-mcp', panel: 'Engine & Cargo Fire', name: 'Autostart - On/Off', boeing: 'S231W240-201', korryTL: '32500-201', cap: '32500-701', qty: 1, old: '', swap: 'Shared with Electrical Panel (8)' },

            // Fuel System
            { zone: 'fuel-jettison', panel: 'Fuel System', name: 'Fuel Pumps (6) - On/Press', boeing: 'S231W240-208', korryTL: '32500-208', cap: '32500-708', qty: 6, old: '', swap: 'Swap across 6 Main/Center Fuel Pumps' },
            { zone: 'fuel-jettison', panel: 'Fuel System', name: 'Fuel Crossfeed - Valve', boeing: 'S231W240-223', korryTL: '32500-223', cap: '32500-723', qty: 2, old: '', swap: 'Forward <-> Aft Crossfeed Valve' }
        ];

        let swappableOnly = false;

        // Render Master Table
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            data.forEach(item => {
                let oldTag = item.old ? `<span class="old-ref">Old: ${item.old}</span>` : '';
                let swapTag = item.swap ? `<br><span class="swap-tag">${item.swap}</span>` : '';
                
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${item.panel}</strong><br>${item.name}</td>
                        <td class="part-no">${item.boeing}</td>
                        <td class="part-no">${item.korryTL}</td>
                        <td class="part-no">${item.cap} ${oldTag}</td>
                        <td>Qty: ${item.qty} ${swapTag}</td>
                    </tr>
                `;
            });
        }

        // Live Search & Filter
        function filterData() {
            const query = document.getElementById('searchInput').value.toUpperCase();
            const filtered = switches.filter(item => {
                const text = `${item.panel} ${item.name} ${item.boeing} ${item.korryTL} ${item.cap} ${item.old}`.toUpperCase();
                const matchesSearch = text.includes(query);
                const matchesSwap = swappableOnly ? item.qty > 1 || item.swap : true;
                return matchesSearch && matchesSwap;
            });
            renderTable(filtered);
        }

        function toggleSwappable() {
            swappableOnly = !swappableOnly;
            const btn = document.getElementById('swapBtn');
            btn.classList.toggle('active', swappableOnly);
            btn.textContent = swappableOnly ? "Showing Swappable Only ✕" : "Show Swappable Parts Only";
            filterData();
        }

        // Open Zone Popup dynamically
        function openZone(zoneId) {
            const zoneItems = switches.filter(s => s.zone === zoneId);
            const modal = document.getElementById('popupModal');
            const content = document.getElementById('popupContent');
            const title = document.getElementById('popupTitle');

            if (zoneItems.length === 0) {
                title.textContent = "Zone Info";
                content.innerHTML = "<p style='color:#bcaaa4;'>No specific modular Korry switches mapped to this quadrant.</p>";
            } else {
                title.textContent = zoneItems[0].panel + " Panel Specs";
                let html = `<table style="width:100%; text-align:left;">
                    <tr style="color:#f59e0b;"><th>Component</th><th>Cap Part #</th><th>Swap Donor Options</th></tr>`;
                zoneItems.forEach(i => {
                    html += `<tr><td>${i.name}</td><td class="part-no">${i.cap}</td><td>${i.swap || 'Dedicated'}</td></tr>`;
                });
                html += `</table>`;
                content.innerHTML = html;
            }

            document.getElementById('dark-screen').style.display = 'block';
            modal.style.display = 'block';
        }

        function showPhoto(src) {
            document.getElementById('photoImg').src = src;
            document.getElementById('dark-screen').style.display = 'block';
            document.getElementById('photoModal').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('dark-screen').style.display = 'none';
            document.getElementById('popupModal').style.display = 'none';
            document.getElementById('photoModal').style.display = 'none';
        }

        // Initialize table on load
        renderTable(switches);
    </script>
</body>
</html>
